services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icc-crm-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CRM_DB_DIR: /app/data
      DATA_CACHE_TTL_MS: ${DATA_CACHE_TTL_MS:-15000}
      BOOTSTRAP_HEAD_EMAIL: ${BOOTSTRAP_HEAD_EMAIL:-head@crm.local}
      BOOTSTRAP_HEAD_PASSWORD: ${BOOTSTRAP_HEAD_PASSWORD:-Head@123456}
      ZEUS_DB_HOST: ${ZEUS_DB_HOST:-zeus-aurora-replica-3-prod.csrn8dqqphhg.ap-southeast-1.rds.amazonaws.com}
      ZEUS_DB_PORT: ${ZEUS_DB_PORT:-3306}
      ZEUS_DB_DATABASE: ${ZEUS_DB_DATABASE:-zeus_core}
      ZEUS_DB_USERNAME: ${ZEUS_DB_USERNAME:-zeus_core_user}
      ZEUS_DB_PASSWORD: ${ZEUS_DB_PASSWORD:-}
    volumes:
      - ./data:/app/data
      - ./conf:/app/conf:ro
    networks:
      - crm-internal
      - proxy-net

  sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icc-crm-sync
    restart: unless-stopped
    command: ["/bin/sh", "./scripts/sync-loop.sh"]
    environment:
      NODE_ENV: production
      CRM_DB_DIR: /app/data
      SPREADSHEET_ID: ${SPREADSHEET_ID:-1CHXlpCmanz8BxvPg91898g_aFoMKKIWx-16n0SyM3wY}
      SHEET_NAME: ${SHEET_NAME:-Data_Model}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-300000}
    volumes:
      - ./data:/app/data
      - ./conf:/app/conf:ro
    networks:
      - crm-internal

  nginx:
    image: nginx:alpine
    container_name: icc-crm-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
      - "4443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - crm-internal
      - proxy-net
    depends_on:
      - app

networks:
  crm-internal:
  proxy-net:
    external: true
    name: zeus-dashboard_zeus-dashboard-network
